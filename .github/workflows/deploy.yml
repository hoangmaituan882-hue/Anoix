name: CI Check

# Deployment is handled by the CloudBase console Git integration:
# push to main -> CloudBase builds the Dockerfile (frontend + API) -> CloudRun.
# This workflow only gates the push with type-check and a production build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build
